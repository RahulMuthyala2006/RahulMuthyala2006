<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
body{
    font-family:Arial;
    background:lightblue;
}
.container{
    width:450px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
h2{
    text-align:center;
    color:blue;
}
table{
    width:100%;
}
td{
    padding:8px;
}
input,select,textarea{
    width:100%;
    padding:5px;
}
input[type=radio]{
    width:auto;
}
input[type=submit]{
    background:green;
    color:white;
    padding:8px;
}
input[type=reset]{
    background:red;
    color:white;
    padding:8px;
}
#result{
    margin-top:30px;
    text-align:center;
}
</style>

<script>
function validate()
{
    if(name.value==""){
        alert("Enter Name");
        return false;
    }

    if(roll.value==""){
        alert("Enter Roll Number");
        return false;
    }

    if(dob.value==""){
        alert("Select Date of Birth");
        return false;
    }

    if(!document.querySelector('input[name="gender"]:checked')){
        alert("Select Gender");
        return false;
    }

    if(email.value==""){
        alert("Enter Email");
        return false;
    }

    if(phone.value==""){
        alert("Enter Phone Number");
        return false;
    }

    if(phone.value.length!=10){
        alert("Phone Number must be 10 digits");
        return false;
    }

    if(course.value==""){
        alert("Select Course");
        return false;
    }

    if(branch.value==""){
        alert("Select Branch");
        return false;
    }

    if(address.value==""){
        alert("Enter Address");
        return false;
    }

    document.getElementById("result").innerHTML =
    "<h2 style='color:green;'>Thank You for Registering!</h2>";

    return false;
}
</script>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form onsubmit="return validate()">

<table>

<tr>
<td>Name</td>
<td><input type="text" id="name"></td>
</tr>

<tr>
<td>Roll No</td>
<td><input type="text" id="roll"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date" id="dob"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
</td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" id="email"></td>
</tr>

<tr>
<td>Phone</td>
<td><input type="text" id="phone"></td>
</tr>

<tr>
<td>Course</td>
<td>
<select id="course">
<option value="">Select</option>
<option>B.Tech</option>
<option>BCA</option>
<option>B.Sc</option>
<option>MCA</option>
</select>
</td>
</tr>

<tr>
<td>Branch</td>
<td>
<select id="branch">
<option value="">Select</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>MECH</option>
<option>CIVIL</option>
</select>
</td>
</tr>

<tr>
<td>Address</td>
<td><textarea id="address"></textarea></td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

<div id="result"></div>

</div>

</body>
</html>//student
